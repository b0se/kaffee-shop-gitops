# Read-only-Variante: sehen, aber nichts aendern.
# Fuer die Uebung "Was sieht ein Entwickler mit eingeschraenkten Rechten?"
apiVersion: v1
kind: ServiceAccount
metadata:
  name: viewer-user
  namespace: headlamp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-viewer-user
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view                 # eingebaute ClusterRole: lesen, aber keine Secrets
subjects:
  - kind: ServiceAccount
    name: viewer-user
    namespace: headlamp
